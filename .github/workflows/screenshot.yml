name: Visual regression preview
on:
  push:
    branches: [main, visual-rebuild-3d, ascii-atmosphere-demo]
    paths:
      - 'scripts/**'
      - 'shaders/**'
      - 'scenes/**'
      - 'project.godot'
      - '.github/workflows/screenshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot with Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          mkdir -p /tmp/engine
          unzip -q /tmp/godot.zip -d /tmp/engine
          chmod +x /tmp/engine/Godot_v4.3-stable_linux.x86_64
      - name: Import project
        run: /tmp/engine/Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Render actual Godot game frame
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" /tmp/engine/Godot_v4.3-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://scripts/capture.gd
          test -s /tmp/kul-tahti-visual-check.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ascii-forest-visual-check
          path: |
            /tmp/kul-tahti-visual-check.png
            /tmp/kul-tahti-world-source.png
